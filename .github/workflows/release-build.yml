name: Build and Release DMG

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS app archive
        run: |
          xcodebuild archive \
            -project HomeWorkApp.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/HomeWorkApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/HomeWorkApp.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Keine .app im Archiv gefunden"
            exit 1
          fi

          mkdir -p dist
          DMG_PATH="dist/HomeWorkApp-${GITHUB_RUN_NUMBER}.dmg"
          hdiutil create \
            -volname "HomeWorkApp" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeWorkApp-dmg
          path: dist/*.dmg

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: HomeWorkApp Release ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.dmg
